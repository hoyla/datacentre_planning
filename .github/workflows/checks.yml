name: Checks

# The first automation in this repo, and deliberately one that checks
# rather than one that publishes (ROADMAP, "CI on GitHub Actions, then a
# publish button"). Nothing here needs a secret or a credential, which is
# the whole reason it can go first: it runs on every push to every
# branch, and a fork can gain nothing by running it. The Postgres the
# unit job starts is a throwaway service container with a throwaway
# password, holding nothing but the schema the tests build.
#
# `permissions: contents: read` is the least privilege that still allows
# a checkout. No job here writes anything back.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer stale, so
# supersede it rather than paying for both.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The same major version as docker-compose.yml. The tests rebuild
    # dcp_test from migrations/*.sql each session (tests/conftest.py), so
    # nothing is loaded into it and nothing needs a credential beyond the
    # throwaway below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dcp
          POSTGRES_PASSWORD: dcp
          POSTGRES_DB: dcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcp:dcp@localhost:5432/dcp
      # An unreachable database fails the job instead of skipping the
      # integration tests (tests/conftest.py, integration_db).
      DCP_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pinned to the version the suite is developed against.
          # pyproject requires >=3.12; CI is not the place to discover
          # what 3.13 does differently.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e '.[dev]'

      # Everything but the `corpus` marker: the unit tests and the 130-odd
      # integration tests, the latter against dcp_test rebuilt from every
      # migration, and none of the browser suites (`reader`, the job
      # below). Until 2026-09-16 the integration tests were deselected
      # here and ran only on a laptop with the container up, so a green
      # job was evidence about parsers and nothing about idempotency,
      # dedup, retirement or the queue's scope. `corpus` names the tests
      # that build from or read the live corpus — two reader builds for
      # the determinism test, and two browser tests that count what a
      # scratch build renders — which no CI database can hold. `-rs`
      # prints every skip with its reason, so a suite that went quiet
      # would show it here.
      - run: python -m pytest -m "not corpus and not reader" -rs

  reader:
    name: Reader behaviour and design
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e '.[dev]'

      - run: python -m playwright install --with-deps chromium

      # The one remaining way this job could report green while asserting
      # nothing: the `page` fixture skips the whole suite when Chromium
      # cannot launch. Fail here instead, where the reason is legible.
      # (A missing or truncated index.html is already a hard failure —
      # conftest's READER_HTML branch calls pytest.fail, not skip.)
      - name: Chromium must actually launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              print("chromium", browser.version)
              browser.close()
          PY

      # Drives the committed index.html — the exact bytes served to
      # readers — rather than building one, so this needs no database
      # either. `-rs` prints the reason for every skip, because a skip
      # here is a test that did not run.
      - name: Drive the committed reader
        env:
          READER_HTML: index.html
        run: python -m pytest -m reader -rs

  middleware:
    name: Edge middleware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The tests use only `node:test`, `node:assert/strict` and the
          # fetch globals, all stable well before 22.
          node-version: '22'

      - run: node --test tests/middleware.test.mjs
