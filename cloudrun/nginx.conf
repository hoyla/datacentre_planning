# Server config for the reader on Cloud Run. Listens on 8080 (the port the
# deploy pins with --port); serves the precompressed index.html via
# gzip_static (the official nginx image is built with the module).
#
# The security headers are ported verbatim from middleware.js
# securityHeaders() — the reader is self-contained apart from its
# OpenStreetMap tiles, so the CSP names exactly that one origin. Keep the
# two copies in step if the page ever gains an external dependency.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip_static on;
    # Fallback runtime gzip for anything without a baked .gz (robots.txt).
    gzip on;
    gzip_types text/plain;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
