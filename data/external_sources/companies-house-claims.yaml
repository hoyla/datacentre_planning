# Capacity and consumption claims transcribed from Companies House filings.
#
# Companies House scans almost everything it publishes, so these documents
# have no text layer. Every figure below was read from the page rendered at
# 300 DPI and checked by eye, not lifted from OCR — OCR misreads a digit
# silently, which is the one failure mode this project cannot tolerate in a
# number. The OCR of each cited page is committed alongside
# (companies_house_ocr/) so the transcription can be re-checked cheaply and
# a test can assert the figures still appear on the page they cite.
#
# What generalises and what does not, established 2026-08-20 and corrected
# 2026-08-21. The first pass pulled the latest accounts for six operators
# and concluded that per-site megawatts are an Ark peculiarity. That was
# too strong, and the fault was mine: for VIRTUS I read the operating
# company, 06762600, which states no capacity. The *property* company,
# 09840065, reports how much of the estate is contracted and billable to
# customers, and gives per-site increments — 6.3MW added at LONDON7 and
# 3.4MW at LONDON11 during 2024. Checking one entity of a group and
# generalising to the group is exactly the error the corpus's own
# site-fragmentation problems keep teaching.
#
# The narrower claim survives: no operator surveyed publishes a per-site
# *total* except Ark, and the statutory part is SECR energy reporting,
# which produces company totals only. Consumption claims here are
# therefore never matched to a site.
#
# Two Virtus filings made up to 31 December 2025 were filed on 19 and 20
# August 2026 and their images were still unavailable from the document
# API on 21 August. Worth retrying: they should carry the same
# disclosures a year newer.

