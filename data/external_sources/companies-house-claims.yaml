  # --- Ark, company-wide metered consumption (SECR, page 8) -------------
  # Company totals across all four sites. Never matched to a site: there
  # is no published split, and attaching a group figure to one campus
  # would be misattribution of exactly the kind this store exists to stop.
  - source: ark_fy2025
    claim_name: Ark Data Centres Limited — total energy consumption
    quantity_type: metered_consumption
    value: 280597
    unit: MWh
    stage: calendar year 2024
    as_at: 2024-12-31
    locator: page 8
    company_level: true
    quote: >-
      Aggregate of total energy consumption in the year 280,597

  - source: ark_fy2025
    claim_name: Ark Data Centres Limited — IT energy consumption
    quantity_type: metered_consumption
    value: 203608
    unit: MWh
    stage: calendar year 2024
    as_at: 2024-12-31
    locator: page 8
    company_level: true
    note: >-
      Averaged over 2024's 8,784 hours this is 23.2 MW of IT load against
      108.42 MW of built capacity across the same company's four sites —
      about 21%. UK Power Networks' half-hourly metering of around 100
      real data centres gives a median mean-utilisation of 18.1%, an
      independent source in the same band. Ark reports energy by calendar
      year while capacity is stated at 30 June 2025, so the two are close
      but not coincident.
    quote: >-
      Aggregate of IT energy consumption in the year 203,608

  # --- Kao, company-wide metered consumption (SECR, page 11) ------------
