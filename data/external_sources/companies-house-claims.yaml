noted:
  - subject: >-
      HFD DataVita Limited: "The AI Growth Zone will enable up to 500 MW
      of AI ready data centre capacity, with the potential to attract
      approximately £8.2 billion of private investment into North
      Lanarkshire and the wider region."
    source: hfd_datavita_fy2025
    locator: page 1
    reason: >-
      A ceiling for a **designated zone**, not for a site. The zone is
      "the company's existing Tier III data centre and surrounding
      development land", formally designated by DSIT, so 500 MW covers
      land beyond anything this corpus holds an application for. Every
      quantity type in this store would misdescribe it: it is not built,
      not let, not contracted with a network, and not a valuation
      assumption. Loading it and matching it would put 500 MW on a site
      page; loading it unmatched would put it in any total that summed
      the store. Quoted here so that a reporter can use it with the
      caveat attached, which is the only way it is safe to use.
    date: 2026-08-26

  - subject: >-
      Segro Pure Premier Park Data Centre Limited states no capacity
      figure of any kind in its first accounts, to 31 December 2025.
    source: segro_pure_premier_park_fy2025
    locator: whole document, 25 pages
    reason: >-
      A measured null rather than an omission, and the qualification the
      Court Lane finding needed. This company is the same shape as UK
      Court Lane DC Ltd — one scheme, one investment property, an
      external valuation by CBRE, a fair-value note that says the
      valuation rests on assumptions — and it does not name a megawatt
      figure among them. Every page was rendered and OCR'd and searched
      for "MW", "MWh", "MVA" and "megawatt"; there are no matches. So a
