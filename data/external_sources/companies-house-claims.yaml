matches:
  - claim_name: Cody Park
    site_id: 14
    method: name_and_applicant
    confidence: strong
    matched_by: hand:claude-opus-5:2026-08-20
    evidence: >-
      Ark's accounts name "the Cody Park site", owned by Ark Estates Cody
      Park Limited. Site 14 carries addresses reading "Cody Park, A101
      Ively Road Farnborough GU14 0LH" and "Cody Technology Park Ively
      Road Farnborough", and its planning documents name Ark as applicant
      64 times — identity of both campus and company. The campus also
      appears as five further site records in neighbouring authorities
      (7 Hart, 240 Guildford, 319/320 Rushmoor, 355 Surrey Heath), none
      with any applicant finding: a cross-boundary materialisation
      artefact, not a rival candidate. The 48.78 MW is the whole campus,
      so it should be read against site 14 as the campus's principal
      record rather than as a figure for one planning application.

  - claim_name: Cody Park (under construction)
    site_id: 14
    method: name_and_applicant
    confidence: strong
    matched_by: hand:claude-opus-5:2026-08-20
    evidence: >-
      Same sentence and same campus as the 48.78 MW built figure above;
      recorded separately because 800kW under construction is a different
      quantity from capacity already built, and merging them would state
      a total the company never stated.

  - claim_name: Spring Park
    site_id: 33
    method: name_and_applicant
    confidence: strong
    matched_by: hand:claude-opus-5:2026-08-20
    evidence: >-
      Ark's accounts name "the Spring Park site", owned by Ark Estates
      Spring Park Limited. Site 33 is "SPRING PARK - TWO DATA CENTRES P3 &
      P4" with addresses at Spring Park, Westwells Road, Hawthorn,
      Corsham, and 142 Ark applicant findings across its documents. Site
      385 covers the same campus from a separate application and carries
      no applicant findings.

  - claim_name: Spring Park (under construction)
    site_id: 33
    method: name_and_applicant
    confidence: strong
    matched_by: hand:claude-opus-5:2026-08-20
    evidence: >-
      Same sentence and campus as the 41.68 MW built figure; kept as its
      own claim for the same reason, and because 13.5MW under
      construction at Corsham is a forward-looking number a reporter may
      want to track separately.

# Claims examined and deliberately left unmatched, with the reason.
considered:
  - claim_name: Meridian Park
    reason: >-
      16.36 MW of built capacity at an operating Ark data centre in
      Enfield, and there is no corresponding site anywhere in this
      corpus — Enfield's only site records are the Metaswitch building
      and two cross-boundary observations of the South Mimms scheme.
      An existing data centre the planning sweep has never seen is a
      finding in its own right, and matching it to nothing is the honest
      record of that.

  - claim_name: A9 building
    reason: >-
      Ark lists the A9 building as a separate holding from the three
      campuses, and states no location for it. Cody Park's buildings are
      lettered in the same series (site 14's addresses include A50, A57
      and A101), which makes Cody Park a plausible home — but plausible
      is not evidence, and folding 1.6 MW into Cody Park would inflate a
      campus figure the company reported separately.

  - claim_name: Company-level consumption (Ark and Kao)
    reason: >-
      SECR figures are company totals covering every site the company
      operates — four for Ark, several for Kao. No published split
      exists, so there is no honest way to attach them to one site.
      They are loaded as unmatched claims and belong in an operator-level
      view rather than a site panel.
