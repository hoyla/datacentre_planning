  # A single-asset SPV, and the third correction to what generalises here
  # (2026-08-24). Every company surveyed on 2026-08-20 and 2026-08-21 was
  # an operator or an operator's property company. This one is neither: it
  # exists to hold one scheme, so its investment property IS the scheme,
  # and FRS 102 makes the directors state the assumptions the valuation
  # rests on. The capacity is therefore in the accounts by construction
  # rather than by narrative choice.
  #
