  # --- Added 2026-08-26, from the scheme-SPV sweep ----------------------
  #
  # 111 companies named in Barbour's owner-role slots, in applicant
  # findings and in organisation_aliases.yaml were resolved at Companies
  # House and their filings pulled (see companies-house-spvs.yaml for
  # which company is which scheme, and companies-house-ownership.yaml for
  # who lends to and owns each). 52 had filed accounts of a category that
  # could carry an investment-property note; every page of all 52 was
  # OCR'd and searched for "MW", "MWh", "MVA" and "megawatt". Ten
  # documents mention megawatts at all, and four of them state something
  # this store did not already hold. Those four are added below.
  #
  # **`locator` is the page number PRINTED ON THE PAGE**, which is what a
  # reader opening the PDF sees, and it is not the PDF's own page index —
  # Companies House filings begin with unnumbered cover pages. Each claim
  # says both.
  #
  # Two corrections to what this file said before.
  #
  # First, **Vantage UK does state a capacity figure.** The 2026-08-20
  # survey recorded Vantage as one of five operators disclosing none.
  # That was read from an earlier filing; the accounts to 31 December
  # 2025, filed on 7 August 2026, carry a SECR table with a "Total IT
  # load (MW)" line. It is a company total, not a site figure, and it is
  # loaded as company_level accordingly.
  #
  # Second, **a single-asset SPV does not always name a capacity.** SEGRO
  # Pure Premier Park Data Centre Limited is exactly the shape Court Lane
  # is — one scheme, one investment property, an external valuation by
  # CBRE, an IFRS 13 fair-value note — and its note says the valuation
  # "incorporates a number of assumptions including market yields,
  # development assumptions and comparable market transactions" without
  # saying what the development assumptions are. So the requirement is to
  # state that assumptions exist; naming a megawatt figure among them is
  # still a choice. Court Lane made it and SEGRO Pure did not. The
  # valuation is loaded and the absence is recorded, because "we looked
  # and it is not there" is a different fact from "we did not look".
  - key: ark_estates_2_fy2025
    company_name: ARK ESTATES 2 LIMITED
    company_number: "12113969"
    filing: Group accounts made up to 30 June 2025
