# Scheme SPVs: which company is which scheme, and how that was decided.
#
# Hand-written. The machine half — charges, PSC, beneficial owners,
# officers, the list of accounts filed — is regenerated into
# companies-house-ownership.yaml beside this file and must not be
# hand-edited. This file holds the judgements: that a name in Barbour's
# client-of-record slot or in an applicant finding IS a particular
# Companies House record, and that that company's one scheme IS a
# particular site in this corpus.
#
# Why this class of company matters, and how it differs from the
# operators surveyed on 2026-08-20 (docs/EXTERNAL_DATA_SOURCES.md §6):
# an operator discloses capacity by choice, and mostly does not. A
# **single-asset scheme SPV discloses it by construction**, because the
# scheme is its investment property and FRS 102 makes the directors
# state what the fair value assumes. UK Court Lane DC Ltd is the worked
# example — a £205m valuation assuming "successful delivery of a 103.3
# MW hyperscale data centre" — and its 103.3 MW disagrees with the 140
# MW grid connection its own planning documents state four times over.
#
# ## What a `site` line here is, and is not
#
# It is an assertion that this company's scheme is that site record. It
# is NOT an assertion that the company's figures may be written into
# that site's capacity fields; nothing here goes into a site column
# (§7.1). Claims go through capacity_claims with their own quantity
# type, and the match through capacity_claim_matches with its own
# evidence.
#
# Three site records in this corpus are known over-merged clusters and a
# mapping through one of them is weaker than a mapping to a tight site,
# whatever the company evidence says. Site 61 carries 308 applications
# across roughly six separate Hayes/Southall campuses; site 59 carries
# 106; site 5 carries 46 in east London. Entries touching them say so
# and take `tentative`, because naming the campus is not the same as
# naming the site record.
#
# ## Confidence
#
#   confirmed  — the name matches a Companies House record exactly and
#                something beyond the name ties it to the scheme: the
#                registered office, a PSC chain to the named operator, a
#                lender, or the scheme's own name inside the company's.
#   probable   — an exact or near-exact name match with a single
#                plausible candidate on the register, but the only tie to
#                the scheme is that the corpus names it there.
#   tentative  — a lead. The site record is a cluster, or the name
#                resolves to more than one plausible company, or the
#                spelling in the corpus is not the registered one.
#
# Seeded 2026-08-26 from Barbour's owner-role blocks, the
# party_applicant and party_other finding families, and
# data/priors/organisation_aliases.yaml, resolved through the Companies
# House search API by scripts/ch_resolve_spvs.py.

as_at: 2026-08-26

companies:

  # --- The worked example, and the reason for the class ----------------
  - company_number: "14045228"
    register: companies_house
    registered_name: UK COURT LANE DC LTD
    corpus_names: [UK Court Lane DC Limited, UK Court Lane DC Ltd,
                   USAARE/CORSCALE UK Court Lane DC LTD]
    scheme: Court Lane Industrial Estate, Iver
    site_id: 81
    confidence: confirmed
    group: Corscale Data Centers (Patrinely / Affinius Capital)
    evidence: >-
      Barbour names it client of record on project 12684006 "Court Lane
      140 MW" with Corscale Data Centers as end user, and the corpus
      carries 42 applicant findings naming it — several in the form
      "USAARE/CORSCALE UK Court Lane DC LTD", which is the tie to the
      group rather than to the name alone. Its accounts name one asset,
      "a freehold property at Court Lane Industrial Estate, Iver".
      Site 81 carries the Court Lane applications
      (ChilternSouthBucks/PL/22/4145/OA, PL/22/3221/EIASR,
      Bucks/PL/26/02874/DE).
    caution: >-
      Site 81's display name is "SEGRO PARK THORNEY BUSINESS PARK -
      PHASE 1 - DATA CENTRE", and SEGRO (Iver 1) Limited and Thorney
      Lane LLP also resolve to it. Iver holds more than one data-centre
      scheme within a kilometre and the site record may be carrying two;
      that is a partitioning question for the site work, not a reason to
      doubt which company holds Court Lane.
    shareholder: >-
      **UK COURT LANE DC HOLDINGS, LP** holds all seven ordinary shares
      (confirmation statement of 21 June 2026). The PSC register says
      "no registrable person" — the LP is not a registrable relevant
      legal entity — so the confirmation statement is where the immediate
      parent is actually named, and it agrees with the accounts' own
      parent-undertaking note.
    finding: >-
      **The 103.3 MW in the accounts is the IT load, and it agrees with
      the planning record.** Site 81's environmental statement states
      "Total IT Load - 103.32 MW" and "Total Data Centre Load – 139.5 MW"
      in one table on page 10 of PL/22/4145/OA, and "The proposed
      development has a 140MW grid connection reserved" on page 27 (and
      four times over across the file). Barbour's 140 MW headline is the
      whole-site load; the audited assumption is the IT load. The three
      numbers are consistent and the apparent 26% discrepancy was an
      artefact of comparing quantities of different kinds. A second
      proposed data centre at the same location is separately described
      as taking "approximately 160MW".

