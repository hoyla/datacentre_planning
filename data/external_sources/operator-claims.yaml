# Capacity figures operators publish about their own sites.
#
# The weakest-authority source in the claims store, and labelled as such:
# marketing material, not an audited or regulatory disclosure. It earns
# its place because it is the only source that covers a site's whole
# intended build-out, and because where it disagrees with the same
# company's audited accounts — Ark's Spring Park is 55 MW here and
# 41.68 MW built in its FY2025 filing — the disagreement is reportable.
#
# Every claim quotes a verbatim span that must still appear in the
# committed snapshot under operator_snapshots/ (whitespace-normalised),
# checked by dcp.capacity_claims.verify_operator_quotes. Refresh the
# snapshots with scripts/fetch_operator_snapshots.py; a figure that has
# moved will fail the check rather than drift silently.
#
# Two things this file deliberately does not do. It does not convert the
# operator's term into ours — "Total Capacity", "Total compute capacity"
# and "IT load" are recorded as printed, because they are not synonyms.
# And it does not load a figure that is plainly a unit error: Greystoke's
# AI Growth Zone page states Humber Tech Park "can provide 384 GW of
# computing power", roughly eight times UK peak demand, against 384 MW on
# two other pages of the same site. That is recorded under `noted` below,
# not as a claim, because loading it would poison every aggregate it
# touched.

sources:
  - key: ark_website
    operator: Ark Data Centres
    snapshot_dir: operator_snapshots
    note: >-
      Capacity is rendered by JavaScript counters that read "0 MW" in the
      raw HTML. The real values are carried twice — in schema.org JSON-LD
      as a "Total Capacity" property, and as fb-count-target attributes —
      and the two agree for all seven sites. Ark is the only operator
      surveyed that date-stamps its figures ("Updated: 1.1.25").

  - key: greystoke_website
    operator: Greystoke Land
    snapshot_dir: operator_snapshots
    note: >-
      A developer rather than an operator: all three schemes are consented
      and unbuilt, and the site labels them "Planning approved". Note the
      real domain is greystoke.co.uk — greystokeland.com is a parked
      lander. Its own pages disagree on the grid position: "more than
      2.5 GW of accepted grid connections" on the home page against
      "2 GWs of accepted grid connections" on the AI Growth Zone page.

  - key: virtus_website
    operator: VIRTUS Data Centres
    snapshot_dir: operator_snapshots
    note: >-
      Publishes per-building figures for every London facility, uniformly
      termed "IT load". No dates anywhere. The wider survey found four
      internal contradictions across its own pages (LONDON7 at 32.5 MW on
      its own page and 28 MW in a carousel; LONDON8 "bespoke design" with
      no figure on its page and 18 MW elsewhere) and a Slough campus total
      that exceeds the sum of its listed buildings — worth putting to
      them, and the reason only campus figures are loaded here.

      **VIRTUS also publishes its own campus boundaries, which is the
      most useful thing on the site for this project** (read
      2026-08-28, Luke). Five UK campuses, each with its own page:

        Stockley Park  LONDON5, 6, 7, 8 (+ LONDON14) — "comprises of
                       four facilities"
        Slough         LONDON3, 4, 9, 10, 11, 12, 19 — "comprises of
                       seven state-of-the-art facilities"
        Hayes          LONDON2
        Enfield        LONDON1
        Saunderton     its own

      **VIRTUS states an IT load for every facility on those campus
      pages** (Luke, 2026-08-28), and they are not loaded here — not
      by policy but because **the snapshotter cannot see them**:

        Stockley Park  LONDON5 24MW · LONDON6 16MW · LONDON7 32.5MW ·
                       LONDON8 bespoke · LONDON14 bespoke
        Slough         LONDON3 7.2MW · LONDON4 26.6MW · LONDON9 24MW ·
                       LONDON10 6.6MW · LONDON11 13.3MW ·
                       LONDON12 21MW · LONDON19 33.5MW  (132.2MW summed)
        Hayes          LONDON2 12.3MW
        Enfield        LONDON1 4.2MW
        Saunderton     78MW across four data centres

      The campus tables are rendered client-side, and
      `fetch_operator_snapshots.py` reads the served HTML: of the rows
      above only "LONDON7 32.5MW" survives into the committed
      snapshot, while the prose figures on the single-facility pages
      (Hayes, Enfield, Saunderton) do. Since every claim here must
      quote text present in its snapshot, twelve published figures
      cannot be loaded until the snapshotter can capture a
      JS-rendered table. That is a gap in the instrument rather than
      in the disclosure, and it will apply to any operator that
      publishes its specifications this way — worth fixing before the
      next capacity sweep, and worth knowing when reading the claim
      store as a survey of what operators publish.

      RESOLVED 2026-08-30: the full snapshot refresh taken for the
      operator pages review captures the campus tables — every row
      above now verifies verbatim against virtus-stockley-park and
      virtus-slough-campus — so the per-facility figures are loaded
      below, each quote gate-checked. The internal contradictions the
      earlier survey found stand and travel as notes on the claims
      (LONDON7 32.5 here against 28 in a carousel; the Slough campus
      total of 145.5 against 132.2 summed from its own rows), because
      they are the reportable part.

      That taxonomy is boundary evidence of the kind
      site_partitions.yaml runs on, and it has already settled two
      questions independently. It confirms the Slough campus drawn out
      of site 23 — LONDON3, LONDON10 and LONDON11 are all Slough by
      VIRTUS's own listing, and LONDON10 is the 75 Buckingham Avenue
      building a Companies House charge identifies. And it confirms
      that site 37 needs no partition: its two Hillingdon stems are
      LONDON5 to LONDON8, which VIRTUS calls one campus. Note the
      corpus does not hold LONDON4, 9, 12 or 19, which VIRTUS places
      at Slough.

  - key: kao_website
    operator: Kao Data
    snapshot_dir: operator_snapshots
    note: >-
      The most useful structure of any operator surveyed: each campus page
      lists buildings with a figure and a lifecycle status in one string,
      "KLON-03 (17.6MW Under Development)". Status vocabulary is
      Operational / Under Development / Planned. Both "ITE load" and
      "IT-load" appear on the same page for the same campus.

  - key: cyrusone_website
    operator: CyrusOne
    snapshot_dir: operator_snapshots
    note: >-
      The only operator in the survey publishing an IT figure and a grid
      figure for the same site, which makes it the sole published
      calibration for how far the two diverge: 8.72 MW IT against 15 MVA
      at LON1, and 90 MW against 160 MVA at LON6 — both close to 1.75x.

  - key: ada_website
    operator: Ada Infrastructure
    snapshot_dir: operator_snapshots
    note: >-
      The headline stat is rendered from embedded application state as
      {"number": 210, "blurb": "Total IT load"} — the megawatt unit exists
      nowhere in the data object, only in adjacent prose, so an automated
      read of the stat block yields a bare 210.

  - key: puredc_website
    operator: Pure Data Centres
    snapshot_dir: operator_snapshots

  - key: vantage_website
    operator: Vantage Data Centers
    snapshot_dir: operator_snapshots

  - key: colt_website
    operator: Colt Data Centre Services
    snapshot_dir: operator_snapshots

  - key: globalswitch_website
    operator: Global Switch
    snapshot_dir: operator_snapshots
    note: >-
      Publishes bare megawatt figures with no qualifying term of any kind,
      inside a contact block. Nothing on the site says whether they are IT
      load, utility supply or installed UPS, so no quantity can be
      inferred beyond "a number the company publishes".

  - key: digitalrealty_website
    operator: Digital Realty
    snapshot_dir: operator_snapshots
    note: >-
      Publishes nothing about capacity on any rendered page — the Power
      section of each facility shows only "UPS redundancy: 2N" — while
      shipping a per-site figure to the browser in embedded application
      state under field_utility_power_capacity. Each facility page carries
      exactly one such value, so attribution needs no inference; the metro
      page carries all of them with the facility stripped, which is why
      the sites are fetched individually. The eleven populated UK values
      sum to exactly 179,900, matching the metro aggregate string
      "179.9k+ kW" in the same payload — which is what establishes the
      unit as kW rather than anything else. The quantity is *utility*
      power, grid supply rather than IT load, so it is recorded as
      grid_connection and is not comparable with the IT figures other
      operators headline. LHR26 and LHR27, both on Ajax Avenue in Slough,
      carry the field empty and are the only UK sites that do.

  - key: stellium_website
    operator: Stellium Datacenters
    snapshot_dir: operator_snapshots

  - key: pulsant_website
    operator: Pulsant
    snapshot_dir: operator_snapshots
    note: >-
      Publishes "Total IT power" for all fourteen of its UK sites, in the
      same words each time — the most complete disclosure of any operator
      surveyed, and the smallest estate: 22.12 MW in total. None is
      matched to a corpus site; these are long-established colocation
      facilities that mostly predate this project's planning window, and
      their pages carry no postcode to match on. They are loaded unmatched
      because "discloses everything, and is tiny" is a fact worth holding
      with evidence rather than asserting.

  - key: nlighten_website
    operator: nLighten
    snapshot_dir: operator_snapshots
    note: >-
      Formerly Proximity Data Centres. Every UK page states the site "is a
      facility with X kW of power" in the lead — present tense — while the
      spec panel qualifies the same number as "Site capacity end-state".
      Recorded here with the spec panel's wording, not the lead's.

  - key: apatura_consultation
    operator: Apatura
    snapshot_dir: operator_snapshots
    note: >-
      A developer's pre-application consultation site
      (consult.apatura.energy), not an operator location page: every
      figure is a proposal. The Westerhill page pairs the data centre
      figure with a 500MW BESS in one sentence and states the BESS is
      consented separately, via a Section 36 application to the
      Scottish Government's Energy Consents Unit.

  - key: digitalreef_website
    operator: Digital Reef
    snapshot_dir: operator_snapshots
    note: >-
      The developer's corporate projects page, the paired opposite of
      the scheme's own consultation site: it states the East Havering
      figure the consultation site omits (the consultation snapshot,
      consult-east-havering, holds no megawatt figure at all —
      operator pages review, 2026-08-30).

  - key: ironmountain_website
    operator: Iron Mountain
    snapshot_dir: operator_snapshots
    note: >-
      Three facilities on one Slough campus, and the survey's second
      self-auditing operator after VIRTUS Saunderton: the campus page
      states 61 MW and its own FAQ breaks that down as 8.7 + 27 + 25 =
      60.7, the 0.3 being rounding of the same kind as Kao's 0.2.
      An operator whose total and breakdown check each other is the
      benchmark for when a campus figure can be trusted at all.

      **The pages are held via a browser harvest** (`--from-file`).
      ironmountain.com sits behind Vercel Attack Challenge Mode and
      answers every scripted client 429, its own homepage included, so
      no amount of backoff reaches it.

      **The FAQ figures are in the raw HTML and not in rendered text**,
      because they sit inside a collapsed `<details>` accordion. That
      is why the capture must be the served bytes and why
      `visible_text()` — which strips tags and evaluates no collapse
      state — sees them where a browser's `innerText` does not.

      **The pages disagree with each other, and that is the finding
      rather than a defect to average away.** LON-1 is 8.7 MW on the
      campus FAQ and 8.75 MW on its own page (printed once as
      "8,75 MW"), and its area is 17,000 m² / 183,000 sq ft on the FAQ
      against 10,400 m² / 112,000 sq ft in its own prose and "14.000
      square meters" in its own stat block — three areas for one
      building, a 63% divergence rather than a rounding. LON-3 is
      5,220 m² on the FAQ and 5,200 m² on its own page. Only the
      operator can say which is gross building area and which is
      technical space.

      **LON-2 has no page of its own** — /lon-2 404s — and is the
      best-evidenced of the three even so: its 27 MW is stated in a
      2021 Iron Mountain investor-relations announcement, "Iron
      Mountain Expands EMEA Data Center Footprint With New 27 Megawatt
      Facility Build in London", which is a communication to investors
      rather than a location page and carries a date.

  - key: questpark_website
    operator: QuestPit
    snapshot_dir: operator_snapshots
    note: >-
      The scheme's marketing site for Quest Park (Home of Production,
      Bedfordshire). The only figure is a grid ambition — "~ 1 GW
      Long-term capability" on a secured connection — not a built or
      announced IT capacity, and the quantity type records it so.

