    method: name_and_operator
    confidence: strong
    matched_by: hand:claude-opus-5:2026-08-20
    evidence: >-
      VIRTUS names its "Saunderton Campus"; site 1 is "SAUNDERTON DATA
      CENTRE - 4 VIRTUS DATA CENTRES" (Buckinghamshire), which names both
      the place and the operator, and VIRTUS's figure is "across four
