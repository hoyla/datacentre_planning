considered:
  - claim_name: Union Park
    reason: >-
      Matched to site 61 on 2026-08-20 and **retired 2026-08-21**. The
      evidence said the site-61 split had left that record clean; it had
      not. The split removed the International Trading Estate, which was
      one of about seven campuses sharing the record — site 61 still
      holds 294 members dominated by the former Nestlé factory (286
      applications) and reaching as far as Western International Market,
      under a display name that reads "NORTH HYDE GARDENS UNION PARK".
      The postcodes I checked were the conflation, not the campus: UB3
      4RF is the Nestlé site, and I read district proximity as identity.
      Ark's Union Park is real and is somewhere inside site 61, but a
      figure attached to a record that is mostly another campus is
      misattributed. What would settle it: an adjudicated partition for
      Union Park in data/priors/site_partitions.yaml, the same treatment
      the International Trading Estate got. Until then no claim should
      attach to site 61 at all — it is a record whose name describes one
      of the campuses it contains.
      SETTLED 2026-08-27: the partition was drawn (site_partitions.yaml,
      ten campuses) and materialised, site 61 is only Union Park, and
      the claim is re-matched above. This entry stays as the record of
      why it was retired and what the release condition was.

  - claim_name: Colt London 4 (Hayes campus)
    reason: >-
      Colt names the campus "London Hayes" and states no street address.
      Press reporting places Colt's London 4 and 5 at Tudor Works,
      Beaconsfield Road, Hayes, which this corpus holds as three separate
      site records (213, 214, 215) for the same address. Choosing one of
      the three on press evidence alone would be a guess dressed as a
      match; the claim is loaded unmatched until the fragmentation is
      resolved or Colt's own material names the street.
      SETTLED 2026-08-27: the fragmentation was the three consultations
      being unlocatable singletons; coordinate priors and the
      tudor-works-colt partition dissolved them into site 75, whose
      Barbour title names Colt London 4 outright. Matched above.

  - claim_name: nLighten London (Hoddesdon)
    reason: >-
      Deliberately not matched to site 97, and it bears on a match already
      held there. Site 97 (Xylem Industrial Estate, Bingley Road,
      Hoddesdon) currently carries two *tentative* NESO rows of 57 MW
      each, matched on place and scale. nLighten's Hoddesdon site is
      3.6 MW end-state — an order of magnitude smaller, and an edge
      colocation facility rather than a shell. Either they are different
      sites in the same town, or the 57 MW attribution is wrong. Recording
      the competing candidate is what lets someone resolve it; asserting
      either way now would not be evidence.

  - claim_name: Global Switch London North / London South
    reason: >-
      18 MW and 70 MW are published on the same page as the London East
      figure that is loaded, with the same absence of any qualifying term.
      Left out of this tranche only because neither corresponds to a
      corpus site; they are worth adding when the Docklands records are
      reviewed.

  - claim_name: Meridian Park
    reason: >-
      No site in this corpus corresponds to Ark's Enfield data centre,
      exactly as its Companies House built-capacity figure found. Two
      independent sources describing an operating data centre the
      planning sweep has never captured.

noted:
  - subject: Digital Realty — per-site capacity published but never rendered
    snapshot: digitalrealty-london
    quote: '"field_utility_power_capacity":"179.9k+ kW"'
    reason: >-
      The metro page's own aggregate, kept as the arithmetic check on the
      per-site claims now loaded above: the eleven populated UK facility
      values sum to exactly 179,900, which is what establishes the unit as
      kW. Not itself a claim — "179.9k+ kW" is a rounded string with a
      plus sign, not a figure. Digital Realty renders none of this on any
      page; the Power section of each facility shows only "UPS redundancy:
      2N". LHR26 and LHR27, both on Ajax Avenue in Slough, carry the field
      empty and are the only UK sites that do.

  - subject: Greystoke, Humber Tech Park — 384 GW
    snapshot: greystoke-ai-growth-zone
    quote: can provide 384 GW of computing power
    reason: >-
      Deliberately not loaded as a claim. 384 GW is roughly eight times
      Great Britain's peak electricity demand and about 150 times the
      2.5 GW the same page claims for the whole North Lincolnshire AI
      Growth Zone; two other pages on the same site give 384 MW. It is a
      unit error, recorded here because a developer publishing it on a
      government-facing investment page is a finding, and because loading
      it would poison every aggregate it touched.
