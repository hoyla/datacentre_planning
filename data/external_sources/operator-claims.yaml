considered:
  - claim_name: Union Park
    reason: >-
      Matched to site 61 on 2026-08-20 and **retired 2026-08-21**. The
      evidence said the site-61 split had left that record clean; it had
      not. The split removed the International Trading Estate, which was
      one of about seven campuses sharing the record — site 61 still
      holds 294 members dominated by the former Nestlé factory (286
      applications) and reaching as far as Western International Market,
      under a display name that reads "NORTH HYDE GARDENS UNION PARK".
      The postcodes I checked were the conflation, not the campus: UB3
      4RF is the Nestlé site, and I read district proximity as identity.
      Ark's Union Park is real and is somewhere inside site 61, but a
      figure attached to a record that is mostly another campus is
      misattributed. What would settle it: an adjudicated partition for
      Union Park in data/priors/site_partitions.yaml, the same treatment
      the International Trading Estate got. Until then no claim should
      attach to site 61 at all — it is a record whose name describes one
      of the campuses it contains.
      SETTLED 2026-08-27: the partition was drawn (site_partitions.yaml,
      ten campuses) and materialised, site 61 is only Union Park, and
      the claim is re-matched above. This entry stays as the record of
      why it was retired and what the release condition was.

  - claim_name: Colt London 4 (Hayes campus)
    reason: >-
      Colt names the campus "London Hayes" and states no street address.
      Press reporting places Colt's London 4 and 5 at Tudor Works,
      Beaconsfield Road, Hayes, which this corpus holds as three separate
      site records (213, 214, 215) for the same address. Choosing one of
      the three on press evidence alone would be a guess dressed as a
      match; the claim is loaded unmatched until the fragmentation is
      resolved or Colt's own material names the street.
      SETTLED 2026-08-27: the fragmentation was the three consultations
      being unlocatable singletons; coordinate priors and the
      tudor-works-colt partition dissolved them into site 75, whose
      Barbour title names Colt London 4 outright. Matched above.

  - claim_name: nLighten London (Hoddesdon)
    reason: >-
      Deliberately not matched to site 97, and it bears on a match already
      held there. Site 97 (Xylem Industrial Estate, Bingley Road,
      Hoddesdon) currently carries two *tentative* NESO rows of 57 MW
      each, matched on place and scale. nLighten's Hoddesdon site is
      3.6 MW end-state — an order of magnitude smaller, and an edge
      colocation facility rather than a shell. Either they are different
      sites in the same town, or the 57 MW attribution is wrong. Recording
      the competing candidate is what lets someone resolve it; asserting
      either way now would not be evidence.

  - claim_name: Global Switch London North / London South
    reason: >-
      18 MW and 70 MW are published on the same page as the London East
      figure that is loaded, with the same absence of any qualifying term.
      Left out of this tranche only because neither corresponds to a
      corpus site; they are worth adding when the Docklands records are
      reviewed.

  - claim_name: Meridian Park
    reason: >-
      No site in this corpus corresponds to Ark's Enfield data centre,
      exactly as its Companies House built-capacity figure found. Two
      independent sources describing an operating data centre the
      planning sweep has never captured.

  - claim_name: CyrusOne LON1 (Slough)
    reason: >-
      **The building is in the corpus; it is mis-clustered, and the
      claim stays unmatched until a partition moves it.** Sheet row
      T4-01 recorded "no candidate found by postcode or name token" and
      left it "not yet". A candidate does exist, and it was missed
      because the search was by postcode and name token: Barbour project
      12216044 carries `Site1: 12 Liverpool Road`, `Site2: London One`,
      end user Zenium, client Segro Plc (the record's own role fields;
      the client-builds/operator-runs split elsewhere on this estate
      suggests landlord and tenant, but that is a reading, not the
      record) — and CyrusOne publishes LON1 at
      12 Liverpool Road, SL1 4QZ. The word "CyrusOne" appears nowhere on
      that record, because Zenium's UK estate was bought by CyrusOne in
      2018 (environment-agency-permit-operators.yaml) and the record
      still stands in Zenium's name. A name-token search cannot find a
      facility filed under the name of the company that used to own it.

      **Why it is still not matched** (Luke, 2026-09-01): "Ptno 12216044
      is not the cyrusone site. It just happens to have the same
      postcode." Project 12216044 is a live member of site
      PTNO-12216044, which is VIRTUS's Slough campus at 75 Buckingham
      Avenue. Attaching 9 MW to that site would put a CyrusOne figure on
      VIRTUS's campus.

      **The mechanism, measured 2026-09-01.** All three Barbour projects
      in that site carry the *identical* coordinate 51.520628,
      -0.623988 — the SL1 4QZ postcode centroid, not their buildings —
      so the spatial rule sees them as zero metres apart. The two VIRTUS
      records name no street at all ("Slough Trading Estate"); only the
      Zenium record names one. Slough/T/138 (LONDON10, 75 Buckingham
      Avenue) sits 243 m away. The cluster is a postcode join wearing a
      spatial edge, and the postcode is shared: Equinix LD10 and LD13x
      are at 13 Liverpool Road next door. Postcode joins in this
      corridor fail towards confident wrong answers, which ROADMAP's
      Equinix survey already warns about naming this exact postcode.

      **What would settle it:** a partition ejecting 12216044 from
      PTNO-12216044 into its own site. Luke holds that (2026-09-01, "I
      will sort out the partitioning later"), and it overturns a written
      adjudication — site_partitions.yaml's `virtus-zenium-slough-campus`
      lists 12216044 deliberately — so it is not a session's call.

      **Open, and deliberately not settled here:** whether Zenium's
      "London One" is the building CyrusOne now calls LON1 at 12
      Liverpool Road, or the one VIRTUS calls LONDON10 at 75 Buckingham
      Avenue. site_partitions.yaml says "the campus VIRTUS acquired from
      Zenium"; environment-agency-permit-operators.yaml says CyrusOne
      bought Zenium's UK estate. Both are in this repository, and they
      cannot both be right about *this building* — but they can both be
      right about the estate.

      **The likeliest reconciliation, and the one to test first** (Luke,
      2026-09-01): "It may be that the Zenium projects were broken up
      and went to different parties." That would make each file correct
      about the assets it saw, and neither wrong. **The corporate
      structure is consistent with it, and proves less than it first
      looks like it proves.** The one Zenium company this corpus holds
      is `ZENIUM UK2 LIMITED`, permit holder for "London Two" — a
      *numbered* per-asset SPV, and the permit-operators note says the
      permits "still stand in the Zenium **companies'** names", plural.
      A permit stays put when a company's shares are sold and must be
      transferred when the building alone is — so undisturbed permits
      across numbered SPVs show the buildings changed hands as
      companies, which fits a piecemeal, buyer-by-buyer break-up and
      fits one buyer taking every SPV exactly as well. The permits
      narrow the mechanism of the sale, not the number of buyers; only
      the filings can do that.

      **What would settle it, and it is this project's own machinery:**
      the Zenium entities have never been through the Companies House
      sweep — no Zenium appears in companies-house-spvs.yaml or in
      organisation_aliases.yaml. The numbering bounds the set, and a
      single-asset SPV's filings state what the asset is and who owns
      it. That is the cheap first move, ahead of the title register.

  - claim_name: CyrusOne LON2 (Prologis Park Heathrow, West Drayton)
    reason: >-
      **A coverage gap, not a matching failure**, and reached
      independently three times. Sheet row T4-02, Luke's own note: "I
      think it's a separate site to the Virtus Prologis Park campus;
      they just happen to both be in Prologis Park." ROADMAP's site-37
      examination (2026-08-28) checked directly and found no application
      in the corpus naming CyrusOne at that postcode or in that site —
      "CyrusOne DC2 is a coverage gap on the same business park, not a
      second operator inside the site record". And the permit channel
      agrees: environment-agency-permit-matches.yaml holds EPR/TP3839QU
      under `considered` as one of the units that "both sit beside site
      37 … adjacent units on one park, not the same installation".

      **What is new, 2026-09-01:** that permit is the same building
      under its former owner's name. Holder ZENIUM UK2 LIMITED, titled
      "London Two", 86.6 MWth, at UB7 9FN — which is the postcode
      CyrusOne publishes for LON2, and "London Two" is what LON2 stands
      for. Probable rather than established, on the same acquisition
      question the LON1 entry above leaves open, and it does not change
      the outcome: there is no planning record for the building either
      way, so the claim stays unmatched.

