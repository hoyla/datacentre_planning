  - site_key: PTNO-12216044
    projects: 5
    proposed: co_located
    scope: distinct_facilities
    total: withhold
    barbour_titles:
      - VIRTUS DATA CENTRES - LONDON 11 DATA CENTRE
      - VIRTUS DATA CENTRES - LONDON 3 DATA CENTRE
      - ZENIUM - DATA CENTRE - FIT-OUT
      - SEGRO PLC  MALTON AVENUE - DATA CENTRE
      - 580-581 IPSWICH ROAD - DATA CENTRE
    power_cell:
      operator_claim: "VIRTUS Slough campus (VIRTUS's own scope)"
      expected_value_mw: 145.5
      note: >-
        VIRTUS's own campus figure for seven facilities, of which three
        have a planning record here and none has a planning document
        held; the planning record states no load at all.
    reason: |
      Reviewed by Luke with Claude, 2026-09-02 — the first of the
      rostered campuses, and a different shape from Stockley Park: there
      is no roster-against-planning-record confirmation to do, because
      the planning record for this campus is three Barbour catalogue
      records and one document-less 2018 outline (Slough/T/138, LONDON10
      at 75 Buckingham Avenue). The roster is the only evidence there is.

      **Distinct facilities**, on the operator's own listing: VIRTUS's
      Slough campus page (snapshot virtus-slough-campus, 2026-08-30)
      names LONDON3, 4, 9, 10, 11, 12 and 19, each with an IT load on one
      basis — 7.2, 26.6, 24, 6.6, 13.3, 21 and 33.5 MW — and a campus
      total of 145.5 MW. The site holds LONDON3 (Barbour 12277044),
      LONDON11 (12575087) and LONDON10 (Slough/T/138, joined 2026-08-28 on
      the Companies House charge naming 75 Buckingham Avenue).

      **Corrected the same evening, on the addresses.** The review first
      said LONDON4, 9, 12 and 19 were nowhere in the corpus, having
      searched by VIRTUS's names. Luke then found the buildings on
      Datacenters.com and Google Maps, and by address two of them ARE
      here, under other names and in other site records: LONDON9 is
      Slough/T/135 ("Single building for data centre development",
      Fullers Logistics Ltd, 470-475 Malton Avenue), the sole
      application of PTNO-12409629, Segro's Malton Avenue site; LONDON11
      and LONDON12 are 580-581 Ipswich Road, Barbour project 12522787,
      held in PTNO-12355161, Segro's Ipswich Road site — while LONDON11's
      own Barbour record sits here on a postcode centroid. LONDON3 and
      LONDON4 share 14 Liverpool Road, next to the Zenium record at 12,
      with no application or record held. LONDON19 has no directory page
      and no location anyone can cite. So the campus VIRTUS calls one
      spans three of this project's site records, under two landlords'
      names, and the sourced denominator is not three of seven but
      "three here, two in Segro's Malton Avenue and Ipswich Road sites,
      one at 14 Liverpool Road unheld, one unlocated". That is the
      partition question below, not a coverage gap alone.

      **Total: withhold.** Summing is never right here — the operator
      states its own total, and the components are its itemisation
      (component_of on each facility claim).

      **The operator's figure ranks the site** (the power_cell above),
      under the rung's empty-ladder extension: the planning record
      states nothing, so nothing is displaced; the cell says the figure
      is VIRTUS's, for its scope, with no planning figure. The
      alternative — leaving the campus claim unmatched because the site
      holds three of seven — was rejected as the #250 failure exactly: a
      145.5 MW campus absent from the hyperscale answer because four
      buildings were never fetched. Saunderton is the precedent (ranks
      on the operator's figure with no planning document at all).

      **A question for the operator, carried as a note on the claim:**
      145.5 exceeds the seven rows summed (132.2) by 13.3 MW, which is
      LONDON11's own figure to the decimal. That is the arithmetic and
      it is ours; how VIRTUS arrived at its total is not inferred from
      it (Luke, 2026-09-02: "we'll keep their claimed figure, but not
      decide how they came to it"). The claimed figure stands as
      claimed; the discrepancy is recorded, not explained.

      **The partition, decided the same evening.** The Iron Mountain
      rule (2026-08-28) is that the partition unit is the campus, not
      the building, drawn with the operator's own page as the source —
      LON-1 and LON-3, 232 m apart, are one partition because Iron
      Mountain calls them one campus. Luke applied it here ("Iron
      Mountain's rule applies", 2026-09-02): Segro's Malton Avenue site
      (LONDON9, Slough/T/135 and Barbour 12409629) and the 580-581
      Ipswich Road project (LONDON11/12, Barbour 12522787) joined this
      one, which is why this entry now lists five projects. The
      counter-consideration — the capacity model's definition of
      2026-08-30, that a campus is a claim about sites and never a
      redefinition of one, with the site derivable from the planning
      record — is met rather than overridden: a partition is exactly the
      hand-adjudicated boundary, with its evidence written down, that
      keeps a site derivable, and the landlord's name on a record is not
      a different scheme. So the row's coverage reads "five here, two
      unheld: LONDON3 and LONDON4 share 14 Liverpool Road with nothing
      filed there, LONDON19 is unlocated". The 145.5 stands as VIRTUS's
      figure for VIRTUS's scope, unchanged by the merge — the site's
      planning record still states no total.

      **Independent of the key question.** The site's key project,
      Zenium's "London One" fit-out at 12 Liverpool Road (12216044), is
      probably CyrusOne's LON1, which publishes that address; Luke holds
      that partition ("I will sort out the partitioning later"). This
      scope decision does not turn on it — LONDON3, 10 and 11 are VIRTUS
      on the records themselves — and would survive the record being
      ejected, though the site key would change.

