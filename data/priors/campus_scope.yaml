  - site_key: PTNO-12489438
    projects: 4
    proposed: co_located
    scope: distinct_facilities
    total: withhold
    barbour_titles:
      - MICROSOFT - IMPERIAL PARK DATA CENTRE
      - MICROSOFT  IMPERIAL PARK DATA CENTRE - CIVIL W
      - NEXT GENERATION DATA - DATA CENTRE THREE (DC3)
      - NEXT GENERATION DATA PROJECT DELTA
    power_cell:
      operator_claim: Vantage Cardiff campus
      expected_value_mw: 148.0
      note: >-
        The 67.2 MW is one application's figure for the data halls at a
        site holding four projects across two operators' names.
    reason: |
      The same shape as Stockley Park and the other half of issue
      #250's measurement: a campus ranked on one of its schemes.

      The planning figure is 67.2 MW, and it is one application's.
      `Newport/23/0323` states "Data halls, containing the servers
      where data is processed and stored (total capacity ~67.2
      megawatts)" — a single scheme on a site that holds four Barbour
      projects across two operators' names, Microsoft's Imperial Park
      records and Next Generation Data's DC3 and Project Delta. The
      site also carries a 60 MW total_site and 50.44 MW of generation,
      so again no two of its figures are the same kind of quantity.

      Vantage acquired Next Generation Data, and its own campus page
      places the campus at Imperial Park, Celtic Way — both in the
      site's planning record — and states 148 MW of critical IT load
      across it, matching also on the CWL1 facility code. That is one
      operator describing one campus on one basis.

      `total: withhold` for the same reason as Stockley: the planning
      figures cannot be summed, and nothing here sums them. The cell
      takes the operator's campus figure and the basis line names the
      67.2 MW it stands above.

      Evidence for the match is in `operator-claims.yaml` (strong,
      name_and_place, Luke at operator pages review T3-04). This was
      issue #250's headline unmatched claim.

