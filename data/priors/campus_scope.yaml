# How a site made of several Barbour projects should present its power.
#
# 35 sites hold more than one Barbour project. They are not one kind of
# thing, which is why no single rule works (Luke, 2026-08-30): some are
# distinct facilities on a campus, some are phases of one scheme, some
# are a masterplan sitting beside its own components, and some are
# different operators who happen to share a postcode. The figures mean
# something different in each case, and summing is right in at most one
# of them.
#
# Every entry here is UNREVIEWED. `proposed` is a first pass from the
# project titles alone and decides nothing; `scope` stays `unreviewed`
# until a person has looked at the records and written the reason. An
# unreviewed site keeps today's behaviour — the largest single figure,
# framed as a floor.
#
# The first pass is crude on purpose and its precedence is arbitrary: it
# tests for a masterplan before it tests for several operators, so
# PTNO-12058499 reads `masterplan_and_parts` when it is also three
# operators — Global Switch, Telehouse and Republic. A site can be more
# than one kind at once, and 17 of the 35 the pass could not place at
# all. Read `proposed` as a starting point for the eye, never as a
# finding.
#
#   scope: distinct_facilities | phases | masterplan_and_parts
#          | co_located | unreviewed
#   total: sum | withhold | unreviewed
#
# `total` is missing a value, found while preparing PTNO-12301553
# (VIRTUS Stockley Park) on 2026-08-31. Where an operator publishes a
# campus figure on one basis, neither option is right: `sum` understates
# it — the roster's three disclosed facilities total 72.5 MW against a
# published campus figure of 112.5, because two of five publish no
# megawatts — and `withhold` is what #247 rejected, since it drops the
# site out of sorting and out of `at_least_100mw`. The missing value
# carries the operator's own stated figure as a first-party claim with
# its source, rather than one we assemble; `operator_stated` is the
# suggested name, and it is the typed-standing ladder rung agreed for
# operator claims (ROADMAP, 2026-08-30). Not added here, because adding
# an enum value nothing reads is a decision for the review, not for the
# file.
#
# See issues #247 (what a campus shows), #250 (under-ranking).

