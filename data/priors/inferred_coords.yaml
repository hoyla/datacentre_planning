  # Tower Hamlets EMR Bidder Street. Same site as the related
  # TowerHamlets/PA/24/01150/NC (rank 46) and Newham/24/00088/FUL
  # (rank 51, editorial highlight), both of which have PlanIt coords.
  - ref: TowerHamlets/PA/24/00091/NC
    lat: 51.51779
    lon: 0.00377
    source: |
      Sibling-ref coord backfill — address ("Land At Former EMR Site,
      Bidder Street, Canning Town") is identical to
      TowerHamlets/PA/24/01150/NC (rank 46) which has PlanIt coords
      (51.51779, 0.00377). Coords cloned from sibling on 2026-05-17.

  # The three Section 35 Direction stubs (dcp/sources/s35.py). A gov.uk
  # publication carries no coordinates, so each stub takes the best
  # primary-source anchor for the land it describes.
  - ref: data-centre-campus-wapseys-wood-buckinghamshire-section-35-direction-planning-act-2008
    lat: 51.58726
    lon: -0.59455
    source: |
      Same scheme as NSIP register row EN0110030 (SDC M40 Campus) —
      the direction the register entry followed from. Coords are the
      register's own GPS for EN0110030 (51.58726008957555,
      -0.5945505216141749). Cloned 2026-08-25.
  - ref: data-centre-campus-ampthill-road-bedford-in-central-bedfordshire-section-35-direction-planning-act-2008
    lat: 52.072922
    lon: -0.489092
    source: |
      Same land as Barbour Ptno 12669230 ("Home of Production", Quest
      Pit, Ampthill Road, Houghton Conquest) — the direction is for
      QuestPit Limited's campus on the same pit; the applicant's request
      statement gives the site as Ampthill Road, Stewartby (MK45 3JP,
      matching Barbour's postcode). Coords are Barbour's for 12669230.
      Cloned 2026-08-25.
  - ref: data-centre-campus-new-barn-road-dartford-section-35-direction-planning-act-2008
    lat: 51.41995
    lon: 0.32772
    source: |
      The applicant's supporting statement (cached at
      data/seed_cases/dartford_ebbsfleet/Supporting_Statement_for_S35.pdf)
      states "National Grid Reference: Easting 561948, Northing 171563"
      for the 58.5 ha site adjacent to New Barn Road. Converted
      OSGB36 -> WGS84 2026-08-25 (OS transverse-Mercator + Helmert
      formulae, verified against the OS guide's worked example; ~5 m).

  # Mulberry Place Town Hall, 5 Clove Crescent — the two records where
  # the Tower Hamlets portal is wrong rather than absent. Corrected
  # 2026-08-25 after the pair was found welding the Shoreditch cluster
  # to the Docklands one; see HISTORY.
  - ref: TowerHamlets/PA/21/02182
    lat: 51.509868
    lon: -0.005808
    source: |
      The portal gives (51.515198, -0.065805), which is 4.1 km west of
      the address on the record and lands in Limehouse. Five other
      records carrying the identical address string — Greenwich/21/3671/K,
      Greenwich/21/4570/K, TowerHamlets/PA/25/01998/S,
      TowerHamlets/PA/21/01304/NC (3-7 Clove Crescent) and
      TowerHamlets/PA/15/01005/R (East India Dock, Clove Crescent) —
      agree on ~(51.5099, -0.0058). Coords taken from
      TowerHamlets/PA/25/01998/S, the same authority and the same
      address line.
  - ref: TowerHamlets/PA/21/02182/A1
    lat: 51.509868
    lon: -0.005808
    source: |
      The advertisement-consent sibling of TowerHamlets/PA/21/02182,
      carrying the same wrong portal coordinate and the same address.
      See that entry for the derivation.

  # Barbour project pins. A `ptno:` entry overrides the provider's own
  # coordinates at clustering time, for records that contradict
  # themselves; the raw Barbour row is untouched (dcp/sites.py).
  - ptno: "12913776"
    lat: 51.58726
    lon: -0.59455
    source: |
      Barbour's pin (51.510536, -0.595041) sits in Slough, 8.5 km south
      of the address on the same record ("Wapseys Wood Landfill, S/O
      A40 Oxford Road, Hedgerley Green", SL9 8TD) — and inside the
      former Akzo Nobel campus cluster's 1 km radius, which it falsely
      bridged. The record's authority field is wrong the same way
      ("Cherwell"). Corrected to the NSIP register's GPS for the same
      scheme (EN0110030: 51.58726008957555, -0.5945505216141749).
      2026-08-25.

  # Hayes/Southall corridor out-of-borough consultations (4 refs).
  # Ealing's consultation copies of Hillingdon schemes carry no
  # coordinates in PlanIt, so each sat as its own unlocatable
  # singleton site (213, 214, 215, 405 in the 2026-08-26
  # materialisation) — which is how "three separate site records for
  # the same address" came to block the Colt London 4 capacity claim
  # (operator-claims.yaml, considered). Each pin below is the
  # Hillingdon stem's own portal coordinate for the scheme the
  # consultation restates; the partition entry in site_partitions.yaml
  # is what lets the resulting spatial edge join them to their campus
  # and nothing else.

