# The facility roster for a site, with the source that names each
# facility and, per facility, the figure attributions a claim or a
# document supports. Issue #247's missing relation, built 2026-08-31;
# dcp/site_facilities.py holds the loading contract.
#
# The premise (ROADMAP, "The missing object is the facility"): figures
# attach to applications and applications aggregate to sites, but the
# thing a figure is actually about — one building, one operator, one
# identity like LONDON7 or KLON-03 — exists nowhere in the model, so
# campus-load questions were being answered by whichever single figure
# a site's largest application carried. The remedy is this relation,
# never a sharper site container.
#
# Rules, enforced by the loader:
#   - a site key that is not live fails the build (the site_aliases
#     contract);
#   - every facility carries at least one identity source, each
#     citable: `operator_roster` (url + date, snapshot-backed),
#     `planning_document` (application + document content hash), or
#     `barbour_title` (ptno + the title verbatim);
#   - an attribution names its `kind` in the source's own terms and
#     references EITHER a claim in the external-claims store (by
#     claim_name) OR a planning document (by `document_sha256`, the
#     content address the document store itself uses) — never both,
#     never neither, and never a value of its own. No megawatt is
#     restated here.
#
# Every reference is to something held, not merely to a URL. An
# operator roster names the snapshot in
# data/external_sources/operator_snapshots/ as well as the page it came
# from, and the loader fails if that file is absent. A planning
# document is named by content hash rather than by Drive file id: the
# hash is the durable address, and `documents.content_sha256` joins to
# `document_drive_files` for the Drive link the reader renders, so a
# re-upload changes the id without touching anything written here.
#
# What listing a facility asserts: that the named source counts it as
# part of the campus associated with this site. It does NOT assert the
# site's planning record contains it — which facilities a site holds,
# and whether any figures roll up, is `campus_scope.yaml`'s question,
# and a roster is evidence that review can cite.
#
# Conflicting attributions co-exist deliberately. Stockley Park is the
# worked case: planning's 24 MW is LONDON7's 2021 handover milestone,
# while VIRTUS puts 24 on LONDON5 and 32.5 on LONDON7 — possibly the
# right number on the wrong building, and only a document or the
# operator can settle it. Both stand below, flagged, resolved by
# nobody.

sites:

  # ---- Kao Harlow. The roster that drove a merge: Kao's page counts
  # KLON-03 in this campus, which is why PTNO-12839274 folded in
  # (PR #268, 2026-08-30).
  - site_key: PTNO-12240972
    note: >-
      Kao's own campus claim ("Kao Data Harlow campus", 71 MW) sits in
      the claims store beside the four per-facility rows referenced
      below; whether the per-facility figures ever roll up is the
      scope review's question.
    facilities:
      - id: KLON-01
        identity:
          - source: operator_roster
            url: https://kaodata.com/locations/harlow/
            snapshot: kao-harlow
            date: 2026-08-30
        attributions:
          - kind: announced capacity, operator's basis
            claim: KLON-01 (Harlow)
      - id: KLON-02
        identity:
          - source: operator_roster
            url: https://kaodata.com/locations/harlow/
            snapshot: kao-harlow
            date: 2026-08-30
        attributions:
          - kind: announced capacity, operator's basis
            claim: KLON-02 (Harlow)
      - id: KLON-03
        identity:
          - source: operator_roster
            url: https://kaodata.com/locations/harlow/
            snapshot: kao-harlow
            date: 2026-08-30
        attributions:
          - kind: announced capacity, operator's basis
            claim: KLON-03 (Harlow)
      - id: KLON-04
        identity:
          - source: operator_roster
            url: https://kaodata.com/locations/harlow/
            snapshot: kao-harlow
            date: 2026-08-30
        attributions:
          - kind: announced capacity, operator's basis
