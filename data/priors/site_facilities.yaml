  # ---- VIRTUS Stockley Park. The campus that opened issue #247: five
  # facilities on the operator's roster, three with planning figures
  # of three different kinds, and no document ever stating the
  # campus's load on a common basis. Facility identity in the planning
  # channel is hand-adjudicated per the issue thread — only a handful
  # of this site's 400-plus documents name a facility at all.
  - site_key: PTNO-12301553
    note: >-
      VIRTUS's campus figure is in the claims store ("VIRTUS Stockley
      Park campus", 112.5 MW). The roster page lists five facilities;
      LONDON8 and LONDON14 carry no operator megawatts ("Bespoke
      design"). The page's own prose says "four facilities" against
      its list of five — quote the list, never the count.
    facilities:
      - id: LONDON5
        identity:
          - source: operator_roster
            url: https://virtusdatacentres.com/locations/uk/london/stockley-park-campus
            snapshot: virtus-stockley-park
            date: 2026-08-30
          - source: planning_document
            application: Hillingdon/37977/APP/2018/3955
            document_sha256: 68a0bc948192db12
            note: identity hand-adjudicated in issue #247's thread
        attributions:
          - kind: announced capacity, operator's basis
            claim: VIRTUS LONDON5 (Stockley Park)
            note: >-
              The wrinkle's other half — VIRTUS puts 24 MW here where
              planning's 24 is LONDON7's handover. Unresolved.
          - kind: average IT load, 2018 reporting scheme
            application: Hillingdon/37977/APP/2018/3955
            document_sha256: 68a0bc948192db12
            page: 12
      - id: LONDON6
        identity:
