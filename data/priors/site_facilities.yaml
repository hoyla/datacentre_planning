  # ---- VIRTUS Saunderton. The self-auditing calibration case, and the
  # only complete roster in this file: four facilities, four figures,
  # summing exactly to the campus total the same sheet states.
  - site_key: PTNO-10234430
    note: >-
      The benchmark for when a campus sum can ever be trusted (ROADMAP,
      #247): LONDON15 9.5 + LONDON16 22.5 + LONDON17 16 + LONDON18 30 =
      the stated "Campus Total of 78 MW", exact, on one page and one
      basis ("78MW of IT load"). Every other campus in this file
      discloses partially, on mixed bases, or not at all. Four of four
      facilities disclose here, and the site record's own name — "4
      VIRTUS DATA CENTRES" — agrees with the roster's count.
      Recorded 2026-09-01, when the snapshot fetcher gained the
      ability to hold a PDF; the figures had been visible in the
      campus datasheet and uncitable before that. The campus total is
      held separately ("VIRTUS Saunderton Campus"): these four are its
      components and must never be summed with it.
    facilities:
      - id: LONDON15
        identity:
          - source: operator_roster
            url: https://virtusdatacentres.com/media/attachments/2026/04/15/virtus_spec_sheet_saunderton-campus-v2.pdf
            snapshot: virtus-saunderton-spec-sheet
            date: 2026-09-01
        attributions:
          - kind: IT load, component of the stated campus total
            claim: VIRTUS LONDON15 (Saunderton)
      - id: LONDON16
        identity:
          - source: operator_roster
            url: https://virtusdatacentres.com/media/attachments/2026/04/15/virtus_spec_sheet_saunderton-campus-v2.pdf
            snapshot: virtus-saunderton-spec-sheet
            date: 2026-09-01
        attributions:
          - kind: IT load, component of the stated campus total
            claim: VIRTUS LONDON16 (Saunderton)
      - id: LONDON17
        identity:
          - source: operator_roster
            url: https://virtusdatacentres.com/media/attachments/2026/04/15/virtus_spec_sheet_saunderton-campus-v2.pdf
            snapshot: virtus-saunderton-spec-sheet
            date: 2026-09-01
        attributions:
          - kind: IT load, component of the stated campus total
            claim: VIRTUS LONDON17 (Saunderton)
      - id: LONDON18
        identity:
          - source: operator_roster
            url: https://virtusdatacentres.com/media/attachments/2026/04/15/virtus_spec_sheet_saunderton-campus-v2.pdf
