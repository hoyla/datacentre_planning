        evidence:
          - source: barbour
            ref: "client role block"
            note: Barbour client on two projects; MCIO is Microsoft's cloud infrastructure arm. A Companies House check would confirm.
            date: 2026-08-23
      - name: Microsoft UK Limited
        relation: same_organisation
        status: proposed
        evidence:
          - source: barbour
            ref: "client role block"
            date: 2026-08-23

  - group: Colt
    members:
      - name: COLT Technology Services
        relation: same_organisation
