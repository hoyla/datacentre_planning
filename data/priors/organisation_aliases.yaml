# Organisation identity, by evidence. Read by dcp/organisations.py.
#
# What this file is for: saying that a name the documents or Barbour use
# belongs to a group — "Ark Estates 5 Ltd" is Ark Data Centres; "VDC
# LHR11 Limited" is a Vantage vehicle — so the workbook and the reader can
# show the group *beside* the raw name. The raw name is never rewritten.
#
# What it is not for: anything dcp/entities.canonical_key already merges
# (legal suffixes, centre/center, "and"/"&", spacing), or per-site
# representation — "Colliers International acted for Amazon at Linmere
# Island" is a Barbour client/end-user record for that project and is read
# from Barbour directly, not asserted here as identity.
#
# Schema
#   groups:
#     - group: <display label>
#       note: <optional>
#       company_number: <the parent's, optional>
#       register: companies_house | cro    # default companies_house
#       members:
#         - name: <exactly as a source writes it>
#           relation: same_organisation | subsidiary_of | trading_name_of | spv_of
#           status: proposed | confirmed
#           company_number: <this entity's own, optional>
#           register: companies_house | cro
#           evidence:            # at least one; each needs a ref or a quote
#             - source: barbour | companies_house | cro | document
#                       | operator_website | register | reporter
#               # `register` is the COUNCIL PLANNING register. A company
#               # register is named for itself: companies_house, or cro
#               # for the Irish Companies Registration Office.
#               ref: <Barbour project ref, company number, document id, URL>
#               quote: <verbatim, where the source is a document>
#               note: <optional>
#               date: <YYYY-MM-DD>
#               site_key: <optional, when the evidence is about one site>
#
# `company_number` is a first-class field rather than a line of evidence
# because it is a JOIN KEY: the newsroom ties many datasets together on
# company numbers, and a number buried in an evidence `ref` cannot be
# selected, exported or joined. The loader checks the FORMAT and refuses
# anything else, because a mistyped number does not fail loudly — it
# silently attaches a site to the wrong company. That the number is the
# right company is what the evidence beside it is for: cite the filing,
# with a date.
#
# `register` travels with it, because the two registers overlap in shape
# and not in meaning: Companies House is eight digits or two letters and
# six; an Irish CRO number is up to six digits, so a CRO number is a
# well-formed nothing at Companies House. Amazon Data Services Ireland
# is in this file. Omit `register` and the number is read as Companies
# House, which is what every entry here was before Ireland appeared.
# Anything joining on these must filter on the register first.
#
# Rules the loader enforces: every member has evidence; a canonical name
# sits in one group only; relation and status are from the closed sets
# above; a company number, where given, is well formed. Builds use
# CONFIRMED members only. Anyone — a session, a batch,
# a research note — may add a proposed member; confirming one is a
# person's decision at the release checkpoint (READER_REDESIGN_PLAN §10).
#
# Seeded 2026-08-23 from Barbour ABI role blocks, all proposed. The
# Barbour evidence shows a client and an end user on one project; whether
# the client is the end user's vehicle, rather than a developer acting
# for it, is the judgement a confirmation makes.

