# The operator's own web pages for a site, hand-verified and
# kind-labelled. Issue #255; the review that produced every entry is
# data/operator_pages_review/operator_pages_review.xlsx (Luke,
# 2026-08-30), and dcp/operator_pages.py holds the loading contract:
# a dead site key fails the build, kinds are `corporate` or
# `consultation`, and `label` only disambiguates same-kind siblings.
#
# The kinds are audiences. A corporate page markets the asset to
# customers and investors and states the power figure almost without
# fail; a consultation page addresses residents and interested parties
# (the tell is a stated consultation period) and almost never states
# it. Five of the first five sites holding both kinds disclosed MW on
# the corporate page and nothing on the consultation page — so the
# kind travels with the link.
#
# "Sheet Tn-nn" below is the row in the review workbook that verified
# the entry; the workbook also holds the capacity claims each page
# made on the day, which fold separately with snapshots.

