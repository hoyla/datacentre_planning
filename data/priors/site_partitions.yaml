# The Hayes/Southall corridor above was this file's longest-standing
# to-do; what remains adjudicated nowhere is recorded in ROADMAP
# (Northumberland Energy Park's four schemes, and the estate-scale
# records blocking permit matches at sites 5, 23 and 59).

  # ------------------------------------------------------------------
  # Slough Trading Estate — site 23 (PTNO-12135970), the largest
  # over-clustering left in the corpus. One site record held 21
  # applications and 15 Barbour projects across at least nine
  # operators' campuses, spread 1.3 km end to end and named after
  # whichever member sorted lowest ("BARCLAYS BANK - DATA CENTRE
  # SOLAR PV PANELS"). Nine Environment Agency permits totalling
  # 1,430 MWth fall inside it, and every one is recorded `considered`
  # rather than matched, because matching any of them would assert an
  # identity between campuses that are plainly distinct
  # (environment-agency-permit-matches.yaml, "Revisit once site 23 is
  # partitioned"). This is that revisit.
  #
  # Boundary evidence, in the order it was trusted: the operator named
  # in the application's own documents; then the permit postcode where
  # it matches an address; then the address itself. The partition unit
  # is the CAMPUS, not the building — Iron Mountain's own pages call
  # LON-1, LON-2 and LON-3 one campus though they sit 810 m apart, and
  # a partition per building would fragment a campus as surely as the
  # radius has welded nine together (Luke, 2026-08-28).
  # ------------------------------------------------------------------

  - name: iron-mountain-london-campus-slough
    reason: |
      Iron Mountain's London campus, and the case that settles how
      these boundaries are drawn. Its own site states "Our campus
      features three facilities — LON-1, LON-2, and LON-3", and gives
      each an address: LON-1 at "724-729 Dundee Road, Slough, SL1 4JU"
      (8.75 MW, "Former Credit Suisse facility extensively upgraded"),
      LON-2 at 110 Buckingham Avenue, LON-3 at "111 Buckingham Avenue
      Slough, SL1 4PF" on a "Secure 2.5-acre site in Slough Trading
      Estate, part of LON-1, LON-2, LON-3 campus". Dundee Road is
      810 m from Buckingham Avenue, so this partition is deliberately
      not contiguous: the operator's own definition of its campus wins
      over the distance between its buildings.

      The documents agree independently. Slough/P/04829/030 names
      "Iron Mountain LON2" and its agent "Gratte Brothers Ltd (on
      behalf of Iron Mountain)"; Slough/P/02933/009 at 724-729 Dundee
      Road names "Iron Mountain"; Slough/T/142(121/19) is the
      demolition of 110 Buckingham Avenue "and the construction of a
      new data centre facility", which is LON-2 replacing the
      Logicalis building the address still carries.

      Permit EPR/TP3120LE (LON3 Data Centre, IRON MOUNTAIN (UK) DATA
      CENTRE LIMITED, 113.31 MWth) is issued at SL1 4PF — the same
      postcode Iron Mountain publishes for 111 Buckingham Avenue, and
      evidence that Barbour's SL1 4PN on PTNO-12833153 is the outlier
      of three sources rather than the truth. Note SL1 4PF is shared
      with Amazon's EPR/PP3309MK, so postcode alone cannot assign a
      permit here; the holder name does.
    applications:
      - Slough/P/02933/009        # LON-1, 724-729 Dundee Road
      - Slough/P/04829/030        # LON-2, 110 Buckingham Avenue
      - Slough/T/142(121/19)      # demolition of 110 for the new build
    projects:
