# Hand-adjudicated campus boundaries the spatial clustering cannot see.
#
# The clustering in dcp/sites.py treats proximity within the radius
# (1 km — campus scale) as same-site evidence. In dense corridors that
# premise fails: two campuses can sit closer together than the radius,
# and the union-find then merges them into one site record. A partition
# names the applications and Barbour projects that form one campus;
# build_clusters will not create a SPATIAL edge between a partitioned
# node and any node outside its partition. Documentary edges (project
# links, family references) are honoured and extend the partition to
# the records they attach; documentary edges joining two different
# partitions fail the run — the record contradicting the adjudication
# is surfaced, never silently resolved.
#
# Maintenance duty: a new application on a partitioned campus must be
# added to its partition unless a family edge already ties it to a
# listed member. An unlisted application with no family edge cannot
# spatially join the partition and will materialise into whichever
# unpartitioned site is in radius — for the entry below, that means a
# new Ealing conditions discharge (whose slashless parent references
# the description miner cannot read) would land in the Union Park site
# until listed here.
#
# Each entry records:
#   - name:         stable slug for the partition
#   - reason:       the evidence that these are distinct campuses
#   - applications: application_refs (must exist in the corpus)
#   - projects:     Barbour Ptnos (projects.external_ref; must exist)

partitions:
  - name: international-trading-estate-southall
    reason: |
      Two distinct campuses materialised as one site: PTNO-12511337,
      "NORTH HYDE GARDENS UNION PARK - DATA CENTRES" (site 61 in the
      2026-08-06 materialisation). Ark's Union Park campus is at North
      Hyde Gardens, Hayes (Hillingdon 75111/* and the surrounding
      cluster); this partition is GTR's campus at the International
      Trading Estate, Trident Way, Southall — applicant "GTR London 2
      S.a.r.l. (Global Technical Realty / GTR)" per the 250949FUL
      planning record — consented 19/12/2025, with its conditions
      discharges and Hillingdon's out-of-borough consultation on the
      same scheme. Portal coordinates put the nearest cross-campus
      pair 0.28 km apart (Hillingdon/39704/APP/2025/812 to the Union
      Park applications), well inside the 1 km radius, so the merge is
      a direct spatial edge, not an artefact of chaining. Found during
      the 2026-08-20 NESO EA Register capacity-claims pilot: register
      rows 927 and 968 name the International Trading Estate and could
      not defensibly be matched to a site labelled Union Park
      (data/external_sources/neso-ea-register-matches.yaml).
    applications:
      - Ealing/244364SCO
      - Ealing/250949FUL
      - Ealing/260588CND
      - Ealing/260589CND
      - Ealing/260590CND
      - Ealing/260718CND
      - Ealing/260719CND
      - Ealing/260783CND
      - Ealing/260786CND
      - Ealing/260790CND
      - Ealing/260830CND
      - Ealing/260831CND
      - Ealing/260832CND
      - Ealing/260925CND
      - Hillingdon/39704/APP/2025/812
    projects:
      - "12842719"

  - name: leamouth-castle-wharf
    reason: |
      Not a campus but a single stray record, partitioned because of
      where it sits rather than what it is.
      TowerHamlets/PA/18/00418/S is "Castle Wharf Esso Petrol Station,
      Leamouth Road" — a non-material amendment to PA/16/01763 for the
      "Relocation of a substation at ground floor level", classified
      `unknown` (the disguise-suspect class, which the universe keeps
      deliberately). It sits on the Leamouth peninsula between the
      Blackwall datacentre quarter and Thameside West, and it is the
      ONLY node joining them: every other cross-campus pair is over the
      radius, and this one makes exactly two edges, both at 0.94 km, to
      Newham/18/03557/OUT and Newham/26/00566/AOD. Enumerated across
      the whole cluster on 2026-08-25 — one record was holding a
      63-application, 9 km "site" together at that seam.
      A substation amendment at a petrol station is not evidence that
      Global Switch and G Park Docklands are one campus, so it takes no
      spatial edge to either.
    applications:
      - TowerHamlets/PA/18/00418/S

  - name: blyth-offshore-wind-onshore-substation
    reason: |
      The onshore grid connection for the Blyth Offshore Wind Farm, on
      the former Blyth power station land that the Northumberland Energy
      Park schemes also occupy. A different scheme, a decade earlier,
      and the reason it matters is what its figure was doing: its
      substation is described as having "the capacity to accommodate up
      to 99.9MW of offshore wind power", and that 99.9 MW was rendering
      as the *data centre's* grid connection on
      PTNO-12785975 (NORTHUMBERLAND ENERGY PARK - NEW CAMBOIS AI),
      whose own stated demand is 1,100 MW — the largest in the corpus.
      `consumption_integrity.py` reported the pair as contradicted, and
      they are not: they are two schemes' figures in one site record.
      A reporter reading 1,100 MW of demand against a 99.9 MW connection
      would have drawn exactly the wrong conclusion about the most
      prominent site we hold.

      The figure itself is correctly adjudicated for its own
      application, so nothing here corrects an adjudication — the
      boundary is what was wrong. Adjudicated by Luke, 2026-08-26.

      Scope is the 2013 permission and its documentary children:
      15/03850/DISCON and 15/04021/FUL both carry `associated_id`
      13/01352/FUL, and 15/04021/FUL names the scheme in full
      ("construction of the Blyth Offshore Wind Farm onshore
      substation"). 15/03832/NONMAT names 13/01352/FUL in its
      description. Northumberland/16/03239/SCREEN is deliberately NOT
      included: a 2016 screening for a new 400kV substation at Blyth is
      a separate question and no evidence ties it to this scheme.
    applications:
      - Northumberland/13/01352/FUL
      - Northumberland/15/03832/NONMAT
      - Northumberland/15/03850/DISCON
      - Northumberland/15/04021/FUL

  - name: canning-town-bidder-street
    reason: |
      The EMR site at Bidder Street and the North Crescent / Galaxy
      Business Centre records, Canning Town — separated from the
      Blackwall quarter (Telehouse, Global Switch, Republic) across
      the River Lea. Unlike the Leamouth seam above, this join is real
      proximity and not an artefact: dozens of pairs fall between 0.61
      and 1.00 km, so no radius short of atomising real campuses
      elsewhere would separate them. Adjudicated by Luke on 2026-08-25
      as separate developments that happen to share a dense quarter —
      different sites, different applicants, opposite banks of the Lea,
      and nothing in either record describing the other as one scheme.
    applications:
      - Newham/17/03755/FUL
      - Newham/20/01187/CLP
      - Newham/21/00374/VAR
      - Newham/22/01862/SCREEN
      - Newham/22/02442/SCOPE
      - Newham/24/00088/FUL
      - Newham/26/01192/AOD
      - TowerHamlets/PA/24/00091/NC
      - TowerHamlets/PA/24/01150/NC
    projects:
      - "12760878"

  - name: silvertown-quays
    reason: |
      Silvertown Quays and the Olympus Silvertown civil works, east of
      the Royal Docks — separated from the Thameside West / G Park
      Docklands campus at the former Paint Factory. Joined to it only
      through Newham/23/02294/REM (Silvertown Quays, classified
      `not_dc`) at 0.58-0.74 km. Adjudicated 2026-08-25 on the same
      reading as Canning Town: adjacent riverside regeneration plots
      that happen to be within a kilometre, with no record describing
      them as one development. Note the general question this raised
      and which was deliberately NOT answered by a rule: family edges
      already refuse to traverse a `not_dc` application, spatial edges
      still do, and changing that globally was judged too broad a
      change to make on the strength of one seam.
    applications:
      - Newham/23/02294/REM
      - Newham/24/00964/AOD
      - Newham/24/00995/AOD
    projects:
      - "12851883"

# Known boundaries still to adjudicate, recorded so the next person
# starts from the list rather than rediscovering it.
#
# Site 61 is not fixed by the partition above; it is one campus less
# conflated. After the International Trading Estate moved to site 443 it
# still holds 294 members, dominated by the former Nestlé factory (286
# applications) and reaching as far as Western International Market,
# under a display name that reads "NORTH HYDE GARDENS UNION PARK". The
# name describes one of the campuses it contains.
#
# That is not cosmetic. A capacity claim matched to site 61 on
# 2026-08-21 — Ark's 99 MW for Union Park — was retired precisely
# because the record is mostly somewhere else, and no claim should
# attach to site 61 until these are separated. The campuses the subtask
# identified, each needing its own adjudicated boundary and written
# evidence:
#
#   Union Park / North Hyde Gardens   (Ark)
#   Former Nestlé factory             (~180 Hillingdon 1331/* applications)
#   Southall Gas Works / The Straight
#   Tudor Works                       (Colt London 4 and 5)
#   Hayes Bridge Retail Park          (Colt London 6-8)
#   Silverdale Road
#   Western International Market
#
# Everything in the Hayes/Southall corridor is pairwise within 1 km, so
# no radius separates them: each needs the same treatment the ITE got,
# which is documentary evidence that a set of applications is one
# campus. Colt's claims are currently unmatched for the same reason —
# its own pages name the campus "London Hayes" and no street.
