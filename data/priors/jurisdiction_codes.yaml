# ---------------------------------------------------------------------
# The `foreign_registry.originating_registry.country` field: where a
# registered overseas entity is itself incorporated. Companies House
# supplies this one from its own overseas-entity record rather than from
# free text, so it is clean — but the registry NAME beside it is not,
# and carries a truncation ("Jersey Financial Services Commissio") and a
# stray space in this pull. The country is what should be read.
# ---------------------------------------------------------------------

registry_countries:

  - raw: 'JERSEY'
    occurrences: 14
    country: JE
    confidence: exact
    reasoning: >-
      All 14 registered overseas entities in this pull are Jersey
      companies — eleven Vantage vehicles, two Tritax propcos and one
      trustee company. Their own incorporation being overseas is a
      different fact from their beneficial owner being overseas, and the
      two must not be counted as one.
    evidence:
      - source: companies_house
        ref: 'OE003126'
        quote: 'JERSEY'
        note: >-
          VDC LHR11 LIMITED, originating registry "Jersey Financial
          Services Commission,Jersey", registration 136359.
        date: '2026-08-26'
