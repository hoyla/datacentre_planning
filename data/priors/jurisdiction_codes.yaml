# ---------------------------------------------------------------------
# Strings that are NOT jurisdictions, or that cannot be mapped to one
# with confidence. These get no country code. They are listed so a
# coverage check can prove they were seen and refused, rather than
# silently defaulted.
# ---------------------------------------------------------------------

unmapped:

  - raw: 'New York Stock Exchange (Nyse)'
    occurrences: 2
    names: listing_venue
    reason: >-
      A stock exchange is not a jurisdiction. A company listed on the
      NYSE may be incorporated anywhere; the field has been filled in
      with where the entity's shares TRADE, not where it is registered.
      Mapping it to US would be a guess dressed as a reading — plenty of
      NYSE-listed companies are incorporated outside the United States.
    evidence:
      - source: companies_house
        ref: 'OE034587'
        quote: 'New York Stock Exchange (Nyse)'
        note: >-
          VDC CWL41 LIMITED, beneficial owner "Digitalbridge Group,
          Inc.".
        date: '2026-08-26'
      - source: companies_house
        ref: 'OE034586'
        quote: 'New York Stock Exchange (Nyse)'
        note: 'VDC CWL42 LIMITED, same beneficial owner.'
        date: '2026-08-26'
    entity_resolved_elsewhere:
      entity: 'DigitalBridge Group, Inc.'
      country: US
      subdivision: US-MD
      basis: >-
        The SAME beneficial owner is recorded with a Maryland
        jurisdiction on eight other filings in this pull (OE006962,
        OE020694, OE032420, OE033263, OE033264, OE033265, OE003126,
        OE003138). That is an inference about the ENTITY, from other
        filings, and it deliberately does not map the STRING: a reader
        drilling into VDC CWL41's own register must see that its filing
        says "New York Stock Exchange (Nyse)" and nothing about a
        country. Any code shown for these two companies has to be
        sourced to the other filings, not to this one.

# ---------------------------------------------------------------------
# The `nationality` field: a PERSON's nationality, on an individual PSC.
#
# Read with care, and never merged into the block above. A nationality
# is not a place of registration; it describes a human being, it is
# self-declared, a dual national declares one of them, and it says
# nothing about where that person's money is or where a scheme's profit
# goes. PLAN_OWNERSHIP increment 1a uses it for one narrow purpose — "a
# controlling individual of UK nationality" as a UK-controlled signal —
# and that is the only use this file supports.
# ---------------------------------------------------------------------

