# Jurisdiction strings as Companies House writes them → ISO codes.
#
# What this file is for. Companies House stores the jurisdiction of a
# corporate PSC or a registered-overseas-entity beneficial owner as a
# FREE-TEXT string typed by the filer. It is not validated, and one
# registry accordingly appears here under four spellings: "United
# States", "Maryland Corporation Registry", "United States - Maryland
# Corporation Registry" and "State Of Maryland Register Of Companies"
# are all the same place. One filer typed "New York Stock Exchange
# (Nyse)", which is a listing venue and not a jurisdiction at all;
# another typed "Britain"; another "Engalnd And Wales". This file is the
# recorded mapping from each raw string to an ISO 3166 code, so that a
# count of foreign-owned schemes can be computed the same way twice.
#
# It is the gate PLAN_OWNERSHIP.md sets on increment 2 (a world map, and
# an ownership-concentration view): "the jurisdiction field is
# normalised to ISO country codes with a recorded mapping".
#
# What it is NOT for.
#
#   * It never rewrites the source. The raw string stays in
#     `data/external_sources/companies-house-ownership.yaml` exactly as
#     the register holds it; this file sits alongside it, per the
#     project's never-mutate-originals principle. Anything reading a
#     code from here must be able to show the raw string beside it.
#   * It does not decide who controls a company. A jurisdiction string
#     says where ONE named entity is registered. Whether that makes the
#     scheme UK-controlled or overseas-controlled is a separate
#     judgement over the whole PSC / beneficial-owner / shareholder
#     record — see PLAN_OWNERSHIP.md increment 1a.
#   * It has no default bucket. A string that cannot be mapped
#     confidently goes under `unmapped:` with the reason. Guessing a
#     country for an unmappable string would put a flag on a map that no
#     filing supports, which is the specific failure the increment-2
#     gate exists to prevent.
#
# Three separate vocabularies, in three blocks, because they answer
# three different questions and merging them would assert things no
# filing says:
#
#   `jurisdictions:`     the PSC / beneficial-owner `registered_in`
#                        field — where a COMPANY is registered.
#   `nationalities:`     the PSC `nationality` field — a PERSON's
#                        nationality, which is not a place of
#                        registration and not evidence about one.
#   `registry_countries:` the `foreign_registry.originating_registry.
#                        country` field on a registered overseas entity
#                        — where the FILING COMPANY itself is
#                        incorporated, not where its owner is.
#
# Schema, per entry in `jurisdictions:` and `unmapped:`
#
#   raw:          the string verbatim, including case and any typo.
#                 This is the key. Match on it exactly.
#   occurrences:  how many PSC / beneficial-owner records carried this
#                 string in the pull dated `as_at`. Recorded for a
#                 coverage audit; it is a snapshot, not a key, and goes
#                 stale the moment the register changes.
#   names:        what the string actually names, from the closed set
#                 country | country_informal | subdivision |
#                 legal_jurisdiction | registry | country_and_registry |
#                 listing_venue
#   country:      ISO 3166-1 alpha-2. Absent on an `unmapped:` entry.
#   subdivision:  ISO 3166-2, where the string names one that exists.
#                 Absent where it does not — "England And Wales" is a
#                 legal jurisdiction spanning GB-ENG and GB-WLS and has
#                 no single ISO subdivision code.
#   legal_jurisdiction: free text, for the England-and-Wales case above.
#   confidence:   exact | probable. `probable` where the code is a
#                 reasonable reading of the string but the string does
#                 not state it — see "England" below.
#   reasoning:    why this code, in one line.
#   evidence:     at least one, each naming the company whose register
#                 carried the string and quoting it verbatim.
#                 source | ref (company number) | quote | note | date
#
# The counting rule this file makes possible, stated for the record: a
# jurisdiction is UK when `country` is GB, and overseas when `country`
# is anything else. JE (Jersey) is NOT GB — it is a Crown Dependency
# with its own company register, and eleven Vantage vehicles in this
# corpus are Jersey companies. A rule that folded Jersey into the UK
# would report those as domestic.

as_at: '2026-08-26'
normalises: >-
  data/external_sources/companies-house-ownership.yaml — the
  `registered_in` and `nationality` fields on `psc.persons`, and
  `foreign_registry.originating_registry.country`.
coverage:
  distinct_strings_seen: 20
  distinct_strings_mapped: 19
  occurrences_seen: 122
  occurrences_mapped: 120
  note: >-
    Every distinct string in the pull is accounted for: 19 mapped below,
    1 under `unmapped:`. Re-run the coverage check after any re-pull —
    a new string must fail loudly rather than fall into a default.

