[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacentre-planning"
version = "0.1.0"
description = "UK data-centre planning-application scraper and analysis pipeline"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "click>=8.1",
    "selectolax>=0.3",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "truststore>=0.10",
    "folium>=0.17",
    # OCR fallback for scanned-only pages (~5% of corpus). pypdfium2 renders
    # pages; the default engine is the system `tesseract` binary (brew install
    # tesseract); rapidocr is the pip-installable alternative engine.
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
    # Non-PDF loaders. 2,082 corpus documents are not PDFs — Word supporting
    # statements, Outlook consultee responses, spreadsheets of plant
    # schedules — and 255 of those arrive with no usable extension, so
    # olefile identifies the legacy Compound File formats by their streams.
    "python-docx>=1.1",
    "striprtf>=0.0.26",
    "extract-msg>=0.48",
    "olefile>=0.47",
    # Claude triage/extraction backend (Sonnet-5-vs-granite trial onward)
    "anthropic>=0.120",
    # OpenAI batch/chat backend. Every route that uses it imports it
    # lazily, so it went undeclared while it was the escalation path for
    # a few deep-reads; READER_REDESIGN_PLAN §3.1 makes it the reading
    # engine for the redesign's adjudication and summarising work, and
    # an undeclared dependency of the default path is a trap for the
    # next person who clones this.
    "openai>=1.100",
    # Google Workspace client, for the Drive archive and the Sheet
    # conversion — drive_sync.py, sheet_sync.py, backup_db.py,
    # create_workbook_sheet.py. Every one imports it inside the function
    # that needs it, which is how it stayed undeclared: any machine that
    # had ever run a sync already had it, so nothing local could notice.
    # CI, cloning from nothing, noticed on the first run.
    "google-api-python-client>=2.190",
    "google-auth-oauthlib>=1.2",
    # DuckDB, for the published database and the release diff —
    # export_duckdb.py, release_diff.py. Undeclared for the same reason,
    # and found the same way.
    "duckdb>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # tests/test_reader_smoke.py drives the built reader in headless
    # Chromium. After `pip install -e '.[dev]'`, fetch the browser once
    # with `playwright install chromium`; the test skips without it.
    "playwright>=1.60",
]

[project.scripts]
dcp = "dcp.cli:main"

[tool.setuptools.packages.find]
include = ["dcp*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Postgres (skipped if unreachable)",
]
